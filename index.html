<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>シンプルToDo</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="todo-app">
      <header>
        <p class="eyebrow">ひとつずつ、前へ。</p>
        <h1>シンプルToDo</h1>
        <p class="intro">今日やることを、ここにまとめましょう。</p>
      </header>

      <form id="task-form" novalidate>
        <label for="task-input">新しいタスク</label>
        <div class="input-row">
          <input id="task-input" name="task" type="text" placeholder="例：本を10ページ読む" autocomplete="off" required aria-describedby="input-error">
          <button class="add-button" type="submit">追加</button>
        </div>
        <p id="input-error" class="error" role="alert" hidden></p>
      </form>

      <section aria-labelledby="list-heading">
        <div class="list-header">
          <h2 id="list-heading">タスク一覧</h2>
          <p id="task-count" role="status"></p>
        </div>
        <ul id="task-list"></ul>
        <p id="empty-message" class="empty-message">タスクはまだありません。<br>まずはひとつ追加してみましょう。</p>
      </section>

      <p id="storage-message" class="error" role="status" hidden></p>
      <footer>タスクはこのブラウザに自動保存されます。</footer>
      <noscript><p class="error">このアプリを使うにはJavaScriptを有効にしてください。</p></noscript>
    </main>
  </body>
</html>
